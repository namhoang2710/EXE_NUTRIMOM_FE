<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="716" viewBox="0 0 1600 716" role="img" aria-labelledby="title desc">
<title id="title">AI tối ưu và gợi ý thực đơn theo hành trình</title><desc id="desc">Minh họa thực đơn dựa trên giai đoạn và nhu cầu dinh dưỡng cá nhân.</desc>
<rect width="1600" height="716" fill="#f2edf2"/>
<g font-family="Arial, sans-serif" fill="#302837">
<text x="68" y="86" font-size="19" font-weight="700" fill="#765a8c" letter-spacing="2">NUTRIMOM · ĐỒNG HÀNH CÙNG MẸ</text>
<text x="68" y="181" font-size="58" font-weight="700">Thực đơn theo</text><text x="68" y="253" font-size="58" font-weight="700">từng chặng của mẹ.</text>
<text x="68" y="318" font-size="24" fill="#706575">AI tối ưu và gợi ý thực đơn xuyên suốt</text><text x="68" y="355" font-size="24" fill="#706575">hành trình, theo nhu cầu cá nhân.</text>
<g font-size="22"><text x="68" y="440" fill="#765a8c">01</text><text x="116" y="440">Hiểu hồ sơ và giai đoạn của mẹ</text><text x="68" y="512" fill="#765a8c">02</text><text x="116" y="512">Gợi ý bữa ăn cân đối, phù hợp</text><text x="68" y="584" fill="#765a8c">03</text><text x="116" y="584">Điều chỉnh cùng hành trình của mẹ</text></g>
