<text x="777" y="127" font-size="25" font-weight="700" fill="#765a8c">NutriMom AI</text><text x="1489" y="125" text-anchor="end" font-size="17" fill="#85738e">MINH HỌA THỰC ĐƠN</text>
<path d="M777 155H1490" stroke="#e6dfe9"/>
<text x="777" y="206" font-size="21" fill="#85738e">LỰA CHỌN CHO MỘT NGÀY</text>
